[project]
name = "gsheir.com"
version = "0.1.0"
description = "Personal portfolio website for Geoffrey Sheir."
authors = [{ name = "gsheir", email = "gsheir@outlook.com" }]
requires-python = ">=3.9,<4"
readme = "README.md"
dependencies = [
    "django>=4.2.7,<5",
    "psycopg2-binary>=2.9.7,<3",
    "requests>=2.31.0,<3",
    "python-decouple>=3.8,<4",
    "whitenoise>=6.6.0,<7",
    "gunicorn>=21.2.0,<22",
    "django-cors-headers>=4.3.1,<5",
    "dj-database-url>=2.1.0,<3",
    "jupyter>=1.1.1,<2",
    "pandas>=2.3.0,<3",
    "lxml>=6.0.0,<7",
    "ruff>=0.14.5",
]

[dependency-groups]
dev = [
    "black>=24.0.0,<25",
    "isort>=5.12.0,<6",
    "flake8>=6.0.0,<7",
    "pytest>=7.4.0,<8",
    "pytest-django>=4.5.2,<5",
]

