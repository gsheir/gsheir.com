<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Geoffrey Sheir{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="{% url 'app:home' %}" class="logo">gsheir</a>
                <nav>
                    <ul>
                        <li><a href="{% url 'app:about_me' %}">About Me</a></li>
                        <li><a href="{% url 'app:cv' %}">My CV</a></li>
                        <li><a href="{% url 'app:blog_home' %}">Blog</a></li>
                        <li><a href="https://weuro2025.gsheir.com">Women's Euro 2025 Game</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            {% if messages %}
                {% for message in messages %}
                    <div class="callout callout-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Geoffrey Sheir. All rights reserved.</p>
            <nav>
                <ul>
                    <li><a href="https://github.com/gsheir/gsheir.com">GitHub</a></li>
                    <li><a href="https://linkedin.com/in/gsheir">LinkedIn</a></li>
                </ul>
            </nav>
        </div>
    </footer>
</body>
</html>
